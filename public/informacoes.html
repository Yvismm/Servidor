<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title> Aula 09 Servidores</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1>Servidor</h1>
    <h2>Yvis Morales</h2>

    <h2>Exemplo de requisição</h2>
    <form action="/cadastrar">
        <p>Nome:       <input type="text"     name="nome"></p>
        <p>Sobrenome:  <input type="text"     name="sobrenome"></p>
        <p>Email:      <input type="email"    name="email"></p>
        <p>Senha:      <input type="password" name="senha"></p>
        <input type="submit" value="Cadastrar" formmethod="post">
        <input type="submit" value="Cadastrar com GET" formmethod="get">
    </form>

    <h2>Exemplo de CREATE</h2>
    <form action="/cadastrar_usuario" method="post">
        <p>Nome:       <input type="text"     name="nome"></p>
        <p>Login:       <input type="text"     name="login"></p>
        <p>Senha:       <input type="password"     name="senha"></p>
        <input type="submit" value="Cadastrar">
    </form>

    <h2>Exemplo de FOR no EJS</h2>
    <form action="/for" method="get">
        <p>Qtde de DIVs: <input type="number" name="qtde"></p>
        <input type="submit">
    </form>
</body>
</html>
